<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTP Member Directory</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark-sm" aria-hidden="true">KTP</div>
      <div class="sidebar-brand-text">KTP National<small>Member Portal</small></div>
    </div>

    <nav aria-label="Sections">
      <ul class="sidebar-nav">
        <li>
          <a class="sidebar-nav-item" href="dashboard.html">
            <span class="nav-dot" aria-hidden="true"></span>
            Alumni Database
          </a>
        </li>
        <li>
          <a class="sidebar-nav-item is-active" href="members.html" aria-current="page">
            <span class="nav-dot" aria-hidden="true"></span>
            Member Directory
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user-email" id="userEmail"></div>
      <button class="btn-signout" id="signOutBtn">Sign out</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="directory-card">
      <div class="directory-header">
        <h2>Member Directory</h2>
        <p id="sessionInfo">Search and connect with current KTP members.</p>
      </div>

      <div class="directory-toolbar">
        <input
          type="search"
          class="search-input"
          data-members-search
          placeholder="Search by name&hellip;"
          aria-label="Search members by name"
        >
        <select class="filter-select" data-members-major aria-label="Filter by major"></select>
        <select class="filter-select" data-members-gradyear aria-label="Filter by graduation year"></select>
        <button type="button" class="btn-reset" data-members-reset>Reset filters</button>
      </div>

      <div class="results-count" data-members-count aria-live="polite"></div>

      <div class="table-scroll">
        <table class="alumni-table">
          <thead>
            <tr>
              <th data-sort-key="name" tabindex="0" role="button" aria-sort="ascending">
                Name<span class="sort-arrow" aria-hidden="true"></span>
              </th>
              <th data-sort-key="major" tabindex="0" role="button" aria-sort="none">
                Major<span class="sort-arrow" aria-hidden="true"></span>
              </th>
              <th data-sort-key="gradDate" tabindex="0" role="button" aria-sort="none">
                Grad Date<span class="sort-arrow" aria-hidden="true"></span>
              </th>
              <th>School Email</th>
              <th>LinkedIn</th>
              <th>Resume</th>
            </tr>
          </thead>
          <tbody data-members-body></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/members.js"></script>
<script>
(function () {
  'use strict';

  if (!window.supabaseClient) {
    document.body.innerHTML =
      '<p style="padding:40px;text-align:center;color:#b3261e;">' +
      'This site isn’t connected to Supabase yet. See README.md to finish setup, ' +
      'then <a href="index.html">return to sign in</a>.</p>';
    return;
  }

  window.KTPAuth.requireSession('index.html').then(function (session) {
    if (!session) { return; } // already redirecting to login

    var email = session.user.email;
    document.getElementById('userEmail').textContent = email;
    document.getElementById('sessionInfo').textContent =
      'Signed in as ' + email + '. Search and connect with current KTP members.';

    document.getElementById('signOutBtn').addEventListener('click', function () {
      window.KTPAuth.signOut().then(function () {
        window.location.href = 'index.html';
      });
    });

    window.KTPMembers.init(document);
  }).catch(function (err) {
    document.body.innerHTML =
      '<p style="padding:40px;text-align:center;color:#b3261e;">' +
      'Couldn’t verify your sign-in' + (err && err.message ? ': ' + err.message : '.') +
      ' <a href="index.html">Return to sign in</a>.</p>';
  });
}());
</script>
</body>
</html>
