<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTP Alumni Directory</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-brand">
    <span class="dot" aria-hidden="true"></span>
    KTP National &middot; Alumni Directory
  </div>
  <div class="topbar-user">
    <span id="userEmail"></span>
    <button class="btn-signout" id="signOutBtn">Sign out</button>
  </div>
</header>

<main class="dashboard">
  <div class="directory-card">
    <div class="directory-header">
      <h2>Alumni Directory</h2>
      <p id="sessionInfo">Search and browse KTP alumni across every chapter.</p>
    </div>

    <div class="directory-toolbar">
      <input
        type="search"
        class="search-input"
        data-alumni-search
        placeholder="Search by name&hellip;"
        aria-label="Search alumni by name"
      >
      <select class="filter-select" data-alumni-chapter aria-label="Filter by chapter"></select>
      <select class="filter-select" data-alumni-company aria-label="Filter by company"></select>
    </div>

    <div class="results-count" data-alumni-count aria-live="polite"></div>

    <div class="table-scroll">
      <table class="alumni-table">
        <thead>
          <tr>
            <th data-sort-key="name" tabindex="0" role="button" aria-sort="ascending">
              Name<span class="sort-arrow" aria-hidden="true"></span>
            </th>
            <th data-sort-key="chapter" tabindex="0" role="button" aria-sort="none">
              Chapter<span class="sort-arrow" aria-hidden="true"></span>
            </th>
            <th data-sort-key="major" tabindex="0" role="button" aria-sort="none">
              Major<span class="sort-arrow" aria-hidden="true"></span>
            </th>
            <th data-sort-key="job" tabindex="0" role="button" aria-sort="none">
              Job<span class="sort-arrow" aria-hidden="true"></span>
            </th>
            <th data-sort-key="company" tabindex="0" role="button" aria-sort="none">
              Company<span class="sort-arrow" aria-hidden="true"></span>
            </th>
            <th data-sort-key="gradDate" tabindex="0" role="button" aria-sort="none">
              Grad Date<span class="sort-arrow" aria-hidden="true"></span>
            </th>
          </tr>
        </thead>
        <tbody data-alumni-body></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/alumni.js"></script>
<script>
(function () {
  'use strict';

  if (!window.supabaseClient) {
    document.body.innerHTML =
      '<p style="padding:40px;text-align:center;color:#b3261e;">' +
      'This site isn’t connected to Supabase yet. See README.md to finish setup, ' +
      'then <a href="index.html">return to sign in</a>.</p>';
    return;
  }

  window.KTPAuth.requireSession('index.html').then(function (session) {
    if (!session) { return; } // already redirecting to login

    var email = session.user.email;
    document.getElementById('userEmail').textContent = email;
    document.getElementById('sessionInfo').textContent =
      'Signed in as ' + email + '. Search and browse KTP alumni across every chapter.';

    document.getElementById('signOutBtn').addEventListener('click', function () {
      window.KTPAuth.signOut().then(function () {
        window.location.href = 'index.html';
      });
    });

    window.KTPAlumni.init(document);
  }).catch(function (err) {
    document.body.innerHTML =
      '<p style="padding:40px;text-align:center;color:#b3261e;">' +
      'Couldn’t verify your sign-in' + (err && err.message ? ': ' + err.message : '.') +
      ' <a href="index.html">Return to sign in</a>.</p>';
  });
}());
</script>
</body>
</html>
