<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTP Important Links</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark-sm" aria-hidden="true">KTP</div>
      <div class="sidebar-brand-text">KTP National<small>Member Portal</small></div>
    </div>

    <nav aria-label="Sections">
      <ul class="sidebar-nav">
        <li>
          <a class="sidebar-nav-item" href="members.html">
            <span class="nav-dot" aria-hidden="true"></span>
            Member Directory
          </a>
        </li>
        <li>
          <a class="sidebar-nav-item" href="dashboard.html">
            <span class="nav-dot" aria-hidden="true"></span>
            Alumni Database
          </a>
        </li>
        <li>
          <a class="sidebar-nav-item is-active" href="links.html" aria-current="page">
            <span class="nav-dot" aria-hidden="true"></span>
            Important Links
          </a>
        </li>
        <li>
          <a class="sidebar-nav-item" href="profile.html">
            <span class="nav-dot" aria-hidden="true"></span>
            Profile
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user-email" id="userEmail"></div>
      <button class="btn-signout" id="signOutBtn">Sign out</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="profile-card">
      <div class="directory-header">
        <h2>Important Links</h2>
        <p>Resources for KTP members will show up here.</p>
      </div>

      <!--
        Placeholder page: no content yet. To add real links, replace this
        block with a list — e.g.:

          <ul class="links-list">
            <li><a class="row-link" href="https://example.com" target="_blank" rel="noopener noreferrer">Link title</a></li>
          </ul>

        or ask Claude to add them from a list you provide.
      -->
      <div style="text-align:center; color:var(--navy-600); padding: 24px 0;">
        Nothing here yet — check back soon.
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
<script>
(function () {
  'use strict';

  if (!window.supabaseClient) {
    document.body.innerHTML =
      '<p style="padding:40px;text-align:center;color:#b3261e;">' +
      'This site isn’t connected to Supabase yet. See README.md to finish setup, ' +
      'then <a href="index.html">return to sign in</a>.</p>';
    return;
  }

  window.KTPAuth.requireSession('index.html').then(function (session) {
    if (!session) { return; } // already redirecting to login

    document.getElementById('userEmail').textContent = session.user.email;

    document.getElementById('signOutBtn').addEventListener('click', function () {
      window.KTPAuth.signOut().then(function () {
        window.location.href = 'index.html';
      });
    });
  }).catch(function (err) {
    document.body.innerHTML =
      '<p style="padding:40px;text-align:center;color:#b3261e;">' +
      'Couldn’t verify your sign-in' + (err && err.message ? ': ' + err.message : '.') +
      ' <a href="index.html">Return to sign in</a>.</p>';
  });
}());
</script>
</body>
</html>
